---
- name: Create backend system group
  ansible.builtin.group:
    name: "{{ backend_group }}"
    system: true
    state: present

- name: Create backend system user
  ansible.builtin.user:
    name: "{{ backend_user }}"
    group: "{{ backend_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create backend application directory
  ansible.builtin.file:
    path: "{{ backend_app_dir }}"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_group }}"
    mode: "0755"

- name: Deploy backend application
  ansible.builtin.template:
    src: backend.py.j2
    dest: "{{ backend_app_dir }}/backend.py"
    owner: "{{ backend_user }}"
    group: "{{ backend_group }}"
    mode: "0755"

- name: Deploy backend systemd service
  ansible.builtin.template:
    src: idtech-backend.service.j2
    dest: /etc/systemd/system/idtech-backend.service
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start backend service
  ansible.builtin.systemd:
    name: idtech-backend
    enabled: true
    state: started

- name: Check backend health endpoint
  ansible.builtin.uri:
    url: "http://{{ backend_bind_address }}:{{ backend_port }}/health"
    return_content: true
    status_code: 200
  register: backend_health
  retries: 5
  delay: 2
  until: backend_health.status == 200

- name: Confirm backend health
  ansible.builtin.debug:
    msg: "Backend health check passed: {{ backend_health.content }}"
  when:
    - backend_health.status == 200
    - backend_health.content == "OK"
